<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POWER GYM — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tr-styles.css') }}">
</head>
<body>

<div id="screen-login" class="screen active">
  <div class="login-box">

    <div class="login-header">
      <div class="login-logo">
        <div class="logo-badge">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Power Gym">
        </div>
      </div>
      <div class="login-role-tag">ACCOUNT RECOVERY</div>
      <div class="login-title">RESET PASSWORD</div>
    </div>

    <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.6;">
      Choose a new password for your account.
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form action="{{ url_for('reset_password', token=token) }}" method="post" class="login-form">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="password-field">
          <input class="form-input" type="password" placeholder="Minimum 8 characters"
                 id="reset-pass" name="password" required minlength="8">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.86 21.86 0 0 1-3.22 4.56M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="password-field">
          <input class="form-input" type="password" placeholder="Re-enter your new password"
                 id="reset-confirm" name="confirm" required minlength="8">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.86 21.86 0 0 1-3.22 4.56M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" type="submit">RESET PASSWORD</button>
    </form>

    <div style="margin-top:18px;text-align:center;font-size:13px;color:var(--muted);">
      <a href="{{ url_for('login') }}" class="link-btn">← Back to Sign In</a>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/tr-common.js') }}"></script>
</body>
</html>
